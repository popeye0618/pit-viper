// 이 파일은 pit-viper 스킬을 쓰려는 프로젝트가 따라할 레퍼런스이기도 하다.
// 스킬이 요구하는 것은 딱 두 가지 — Jacoco XML 리포트와 pitest XML 리포트.

plugins {
    id 'java'

    // 커버리지 계측. Gradle 에 내장돼 있어서 버전을 적지 않아도 된다.
    id 'jacoco'

    // Spring Boot 4.x 가 최신이지만 3.5 라인을 쓴다.
    // 이 프로젝트의 목적은 최신 major 검증이 아니라 스킬을 돌릴 무대를 만드는 것이다.
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'

    // 뮤테이션 테스팅. 프로덕션 코드를 일부러 변형(뮤턴트)시켜 보고
    // 그래도 테스트가 안 깨지면 "그 자리는 검증되지 않았다"고 알려준다.
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'pit-viper'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // pitest 는 JUnit 4 시절에 만들어졌다. JUnit 5 테스트를 인식시키려면 이 플러그인이 필요하다.
    pitest 'org.pitest:pitest-junit5-plugin:1.2.3'
}

tasks.withType(JavaCompile).configureEach {
    // 주석이 한국어라 인코딩을 명시하지 않으면 환경에 따라 깨진다.
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()

    // 커버리지 리포트는 테스트가 끝난 뒤에만 의미가 있다.
    // 이렇게 걸어두면 ./gradlew test 한 번으로 jacoco XML 까지 나온다.
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn test

    reports {
        // ⚠️ XML 은 기본으로 꺼져 있다.
        // HTML 만 켜져 있으면 사람은 볼 수 있지만 스크립트가 읽을 게 없다.
        // XML = 도구가 읽는 계약, HTML = 사람이 보는 용도.
        xml.required = true
        html.required = true
    }
}

pitest {
    pitestVersion = '1.19.1'
    junit5PluginVersion = '1.2.3'

    // 뮤테이션을 적용할 대상. 값 객체와 업무 규칙이 있는 곳만 본다.
    //
    // -PpitScope 를 주면 그 목록으로 덮어쓴다. 스킬의 scope.sh 가 "이 브랜치가 바꾼 클래스"만
    // 뽑아 넣는 자리다. 안 주면 아래 기본값이 그대로 쓰여 기준선이 흔들리지 않는다.
    //   ./gradlew pitest -PpitScope=$(.claude/skills/pit-viper/scripts/scope.sh main --pitest)
    targetClasses = findProperty('pitScope')?.toString()?.tokenize(',')
            ?: ['com.pitviper.common.vo.*', 'com.pitviper.customer.*', 'com.pitviper.order.*']

    // ⚠️ 반드시 명시한다. pitest 는 targetTests 를 안 주면 targetClasses 와 같은 패턴으로
    // 테스트를 고른다. 그러면 -PpitScope 로 대상을 좁히는 순간 실행할 테스트가 0개가 되고,
    // 멀쩡히 검증되던 코드가 전부 NO_COVERAGE 로 보고된다.
    // 좁혀야 하는 것은 "뮤턴트를 심을 대상"이지 "돌릴 테스트"가 아니다.
    targetTests = ['com.pitviper.*']

    // 설정·DTO·컨트롤러·에러코드는 분기가 없어 뮤턴트가 의미 없다.
    excludedClasses = ['*.*Config', '*Application', '*.dto.*', '*.controller.*', '*.exception.*']
    excludedMethods = ['toString', 'hashCode', 'equals']

    // @SpringBootTest 같은 무거운 테스트가 섞이면 실행 시간이 폭발한다.
    excludedGroups = ['integration']

    // 로깅 라인에 뮤턴트를 심어봐야 잡을 방법이 없다.
    avoidCallsTo = ['org.slf4j']

    // ⚠️ DEFAULTS 에는 NEGATE_CONDITIONALS 가 들어있지 않다
    // (RemoveConditional 계열과 반환값 계열로 대체되어 있다).
    // 조건 반전은 테스트 구멍을 드러내는 대표 유형이라 명시적으로 추가한다.
    mutators = ['DEFAULTS', 'NEGATE_CONDITIONALS']

    outputFormats = ['XML', 'HTML']
    timestampedReports = false

    // 생존 뮤턴트가 있는 것이 이 프로젝트의 출발점이다.
    // 임계값을 걸면 빌드가 실패하므로 0 으로 둔다.
    mutationThreshold = 0
}
